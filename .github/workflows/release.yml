name: 🚀Release
run-name: ${{ vars.PROJECT_NAME }} ${{ inputs.release-type }} Release ${{ inputs.dry-run == true && '(Dry Run)' || '' }}


defaults:
  run:
    shell: pwsh


on:
  workflow_dispatch:
    inputs:
      release-type:
        description: The type of release. Choose 'Preview' or 'Production'.
        required: true
        type: choice
        options: [Preview, Production]
      trigger-docs-release:
        description: Trigger Velaptor docs release workflow after the library release is done. Only applicable for production releases.
        required: false
        default: true
        type: boolean
      cache-disabled:
        description: Cache Disabled - Check to disable caching for the workflow.
        required: false
        default: false
        type: boolean
      dry-run:
        description: Dry Run - Check to run the workflow without creating a release.
        required: false
        default: false
        type: boolean


permissions: {} # Set the permissions to an empty object to prevent the workflow from having any permissions by default.


jobs:
  get_and_validate_version:
    name: Get And Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get Version
        id: get-version
        uses: KinsonDigital/Infrastructure/actions/get-version@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          version-file-path: "${{ github.workspace }}/${{ vars.PROJECT_NAME }}/${{ vars.PROJECT_NAME }}.csproj"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}

      - name: Validate Version
        id: validate-version
        uses: KinsonDigital/Infrastructure/actions/validate-version@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          version: "v${{ steps.get-version.outputs.version }}"
          release-type: "${{ inputs.release-type }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}


  run_prerelease_validation:
    name: Run Pre-Release Validation
    needs: [get_and_validate_version]
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PROD_BRANCH: ${{ vars.PROD_BRANCH }}
          PREV_BRANCH: ${{ vars.PREV_BRANCH }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          $releaseType = "$env:RELEASE_TYPE".ToLower().Trim();
          $branchName = "$env:BRANCH_NAME".Trim();
          $expectedBranchName = $releaseType -eq "production" ? $env:PROD_BRANCH : $env:PREV_BRANCH;
          $errorMsg = "::error::The branch name must be '$expectedBranchName' for a $releaseType release.";

          if ($branchName -ne $expectedBranchName) {
            Write-Host $errorMsg;
            exit $env:DRY_RUN -eq "true" ? 0 : 1;
          }

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up Deno (${{ vars.DENO_VERSION }})
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 #v2.0.4
        with:
          deno-version: ${{ vars.DENO_VERSION }}
          cache: ${{ inputs.cache-disabled == true && 'false' || 'true' }}

      - name: Validate Tag
        id: tag-check
        uses: KinsonDigital/Infrastructure/actions/validate-tag@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          repo-owner: "${{ vars.ORGANIZATION_NAME }}"
          repo-name: "${{ vars.PROJECT_NAME }}"
          release-type: "${{ inputs.release-type }}"
          tag-name: "v${{ needs.get_and_validate_version.outputs.version }}"
          github-token: "${{ secrets.CICD_TOKEN }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
        continue-on-error: true

      - name: Validate SDK Versions
        id: sdk-check
        uses: KinsonDigital/Infrastructure/actions/validate-sdk-versions@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          base-search-dir-path: "${{ github.workspace }}"
          net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
        continue-on-error: true

      - name: Release Notes Exist
        id: release-notes-check
        uses: KinsonDigital/Infrastructure/actions/release-notes-exist@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          release-notes-file-path: "${{ github.workspace }}/ReleaseNotes/${{ inputs.release-type }}Releases/${{ vars.RELEASE_NOTES_FILE_NAME_PREFIX }}v${{ needs.get_and_validate_version.outputs.version }}.md"
          fail-if-does-not-exist: true
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
        continue-on-error: true

      - name: Nuget Package Does Not Exist
        uses: KinsonDigital/Infrastructure/actions/nuget-pkg-exists@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        id: package-check
        with:
          nuget-pkg-name: "${{ vars.ORGANIZATION_NAME }}.${{ vars.PROJECT_NAME }}"
          nuget-pkg-version: "${{ needs.get_and_validate_version.outputs.version }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
        continue-on-error: true

      - name: Milestone Exists
        id: milestone-exists
        uses: KinsonDigital/Infrastructure/actions/milestone-exists@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          owner-name: "${{ vars.ORGANIZATION_NAME }}"
          repo-name: "${{ vars.PROJECT_NAME }}"
          milestone-name: "v${{ needs.get_and_validate_version.outputs.version }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
          github-token: "${{ secrets.CICD_TOKEN }}"
        continue-on-error: true

      - name: Validate Milestone Items
        id: milestone-items-check
        uses: KinsonDigital/Infrastructure/actions/milestone-items-closed@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          owner-name: "${{ vars.ORGANIZATION_NAME }}"
          repo-name: "${{ vars.PROJECT_NAME }}"
          milestone-name: "v${{ needs.get_and_validate_version.outputs.version }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
          fail-if-all-items-not-closed: true
          github-token: "${{ secrets.CICD_TOKEN }}"
        continue-on-error: true

      - name: GitHub Release Does Not Exist
        id: github-release-check
        uses: KinsonDigital/Infrastructure/actions/github-release-exists@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          owner-name: "${{ vars.ORGANIZATION_NAME }}"
          repo-name: "${{ vars.PROJECT_NAME }}"
          tag-name: "v${{ needs.get_and_validate_version.outputs.version }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
          github-token: "${{ secrets.CICD_TOKEN }}"
        continue-on-error: true

      - name: Should Fail Job
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          $tagCheckFailed = "${{ steps.tag-check.outcome == 'failure' }}";
          $sdkCheckFailed = "${{ steps.sdk-check.outcome == 'failure' }}";
          $notesFileCheckFailed = "${{ steps.release-notes-check.outcome == 'failure' }}";
          $packageCheckFailed = "${{ steps.package-check.outcome == 'failure' }}";
          $milestoneExistsFailed = "${{ steps.milestone-exists.outcome == 'failure' }}";
          $milestoneExists = "${{ steps.milestone-exists.outputs.milestone-exists }}";
          $milestoneItemsCheckFailed = "${{ steps.milestone-items-check.outcome == 'failure' }}";
          $githubReleaseCheckFailed = "${{ steps.github-release-check.outcome == 'failure' }}";
          $githubReleaseExists = "${{ steps.github-release-check.outputs.release-exists }}";

          if ($tagCheckFailed -eq "true") {
            Write-Host "::error::Tag already exists. Please update the version in the '$env:PROJECT_NAME.csproj' file.";
          }

          if ($sdkCheckFailed -eq "true") {
            Write-Host "::error::One or more of the SDK versions are invalid. Check each '.csproj' file.";
          }

          if ($notesFileCheckFailed -eq "true") {
            Write-Host "::error::The release notes for version '${{ needs.get_and_validate_version.outputs.version }}' do not exist.";
          }

          if ($packageCheckFailed -eq "true") {
            Write-Host "::error::The NuGet package already exists.";
          }

          if ($milestoneExistsFailed -eq "true") {
            Write-Host "::error::Failed to check if milestone exists.";
          }

          if ($milestoneExists -eq "false") {
            Write-Host "::error::The milestone 'v${{ needs.get_and_validate_version.outputs.version }}' does not exist.";
          }

          if ($milestoneItemsCheckFailed -eq "true") {
            Write-Host "::error::The milestone 'v${{ needs.get_and_validate_version.outputs.version }}' has one or more issues that are not closed or PRs that are in draft.";
          }

          if ($githubReleaseCheckFailed -eq "true") {
            Write-Host "::error::Failed to check if the GitHub release exists.";
          }

          if ($githubReleaseExists -eq "true") {
            Write-Host "::error::The GitHub release already exists.";
          }

          if ($tagCheckFailed -eq "true" `
              -or $sdkCheckFailed -eq "true" `
              -or $notesFileCheckFailed -eq "true" `
              -or $packageCheckFailed -eq "true" `
              -or $milestoneExistsFailed -eq "true" `
              -or $milestoneExists -eq "false" `
              -or $milestoneItemsCheckFailed -eq "true" `
              -or $githubReleaseCheckFailed -eq "true" `
              -or $githubReleaseExists -eq "true") {
            exit 1;
          }


  # Build with all build configurations
  build:
    name: Build Velaptor
    needs: [get_and_validate_version, run_prerelease_validation]
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
        build_config: [Debug, Telemetry-Debug, Release, Telemetry-Release]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Run Build
        run: dotnet build "${{ github.workspace }}/${{ vars.PROJECT_NAME }}/${{ vars.PROJECT_NAME }}.csproj" -c ${{ matrix.build_config }};


  run_tests:
    name: Run Unit Tests
    needs: [get_and_validate_version, run_prerelease_validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "ubuntu-latest"
          - platform: "macos-latest" # ARM-based (M1 and above).
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Run Tests
        run: |
          dotnet test "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}Tests/${{ vars.PROJECT_NAME }}Tests.csproj" `
            -c ${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }};


  perform_release:
    name: Perform ${{ inputs.release-type }} Release
    runs-on: ubuntu-latest
    needs: [get_and_validate_version, run_prerelease_validation, build, run_tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "${{ vars.NET_SDK_VERSION }}"

      - name: Set Up Nuget
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 #v4.0.0

      - name: Set Up Deno (${{ vars.DENO_VERSION }})
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 #v2.0.4
        with:
          deno-version: ${{ vars.DENO_VERSION }}
          cache: ${{ inputs.cache-disabled == true && 'false' || 'true' }}

      - name: Transpile README
        uses: KinsonDigital/Infrastructure/actions/transpile-readme@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          base-dir-path: "${{ github.workspace }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}

      - name: Update Copyright
        uses: KinsonDigital/Infrastructure/actions/update-copyright@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          cs-proj-file-name: "${{ vars.PROJECT_NAME }}.csproj"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}

      - name: Create Nuget Package
        env:
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
        run: |
          dotnet pack `
            "${{ github.workspace }}/${{ vars.PROJECT_NAME }}/${{ vars.PROJECT_NAME }}.csproj" `
            -o "${{ github.workspace }}" `
            -c ${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }} `
            -p:IncludeSymbols=true `
            -p:SymbolPackageFormat=snupkg `
            -p:EnableTelemetry="${{ vars.TELEMETRY_ENABLED }}" `
            -p:TelemetryKey="$env:TELEMETRY_KEY";

      - name: Publish Nuget Package ${{ inputs.dry-run == true && '(Dry Run)' || '' }}
        if: inputs.dry-run == false
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          $version = "${{ needs.get_and_validate_version.outputs.version }}";
          $version = $version.StartsWith("v") ? $version.Substring(1) : $version;

          # Push the nuget package
          dotnet nuget push `
            "${{ github.workspace }}/${{ vars.ORGANIZATION_NAME }}.${{ vars.PROJECT_NAME }}.$version.nupkg" `
            --api-key "$env:NUGET_API_KEY" `
            --source https://api.nuget.org/v3/index.json;

      - name: Create GitHub Release ${{ inputs.dry-run == true && '(Dry Run)' || '' }}
        if: inputs.dry-run == false
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd #v1
        with:
          name: "🚀${{ inputs.release-type }} - v${{ needs.get_and_validate_version.outputs.version }}"
          tag: "v${{ needs.get_and_validate_version.outputs.version }}"
          owner: ${{ vars.ORGANIZATION_NAME }}
          repo: ${{ vars.PROJECT_NAME }}
          bodyFile: "${{ github.workspace }}/ReleaseNotes/${{ inputs.release-type }}Releases/${{ vars.RELEASE_NOTES_FILE_NAME_PREFIX }}v${{ needs.get_and_validate_version.outputs.version }}.md"
          artifacts: "${{ github.workspace }}/ReleaseNotes/${{ inputs.release-type }}Releases/${{ vars.RELEASE_NOTES_FILE_NAME_PREFIX }}v${{ needs.get_and_validate_version.outputs.version }}.md"
          prerelease: ${{ inputs.release-type == 'Preview' }}
          token: ${{ secrets.CICD_TOKEN }}

      - name: Close Milestone ${{ inputs.dry-run == true && '(Dry Run)' || '' }}
        if: inputs.dry-run == false
        uses: KinsonDigital/Infrastructure/actions/close-milestone@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          repo-owner: "${{ vars.ORGANIZATION_NAME }}"
          repo-name: "${{ vars.PROJECT_NAME }}"
          milestone-title: "v${{ needs.get_and_validate_version.outputs.version }}"
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
          github-token: "${{ secrets.CICD_TOKEN }}"

  # Execute the full Velaptor docs release workflow after the library release is done.
  release_velaptor_docs:
    name: Release Velaptor Docs
    runs-on: ubuntu-latest
    needs: [get_and_validate_version, run_prerelease_validation, build, run_tests, perform_release]
    if: ${{ inputs.release-type == 'Production' && inputs.dry-run == false && inputs.trigger-docs-release == true }}
    steps:
      - name: Execute Release
        env:
          VERSION: "v${{ needs.get_and_validate_version.outputs.version }}"
          GH_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: |
          $workflowName = "${{ vars.VELAPTOR_DOCS_FULL_RELEASE_WORKFLOW_NAME }}";
          $orgName = "${{ vars.ORGANIZATION_NAME }}";
          $repoName = "${{ vars.VELAPTOR_DOCS_REPO_NAME }}";
          $docSiteReleaseBranch = "${{ vars.DOC_SITE_RELEASE_BRANCH }}";
          $version = $env:VERSION;

          gh workflow run $workflowName -R "$orgName/$repoName" --ref "$docSiteReleaseBranch" --field "api-version=$version" --field "executed-externally=true";


  send_release_announcements:
    name: Send Release Announcements
    runs-on: ubuntu-latest
    needs: [get_and_validate_version, run_prerelease_validation, build, run_tests, perform_release]
    if: ${{ inputs.dry-run == false }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Send X Release Announcement
        uses: KinsonDigital/Infrastructure/actions/send-x-release-announcement@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          repo-owner: ${{ vars.ORGANIZATION_NAME }}
          project-name: ${{ vars.PROJECT_NAME }}
          version: ${{ needs.get_and_validate_version.outputs.version }}
          website-url: ${{ vars.WEBSITE_URL }}
          local-post-template-file-path: "${{ github.workspace }}/templates/release-announcement.txt"
          discord-invite-code: ${{ vars.DISCORD_INVITE_CODE }}
          access-token-key: ${{ secrets.X_ACCESS_TOKEN_KEY }}
          access-token-secret: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          consumer-api-key: ${{ secrets.X_CONSUMER_API_KEY }}
          consumer-api-secret: ${{ secrets.X_CONSUMER_API_SECRET }}
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
          github-token: ${{ secrets.CICD_TOKEN }}

      - name: Send Bluesky Release Announcement
        uses: KinsonDigital/Infrastructure/actions/send-bluesky-release-announcement@9c4f1702ed7e5f785415d7db14796b1dde7c6a16 # v17.2.0
        with:
          repo-owner: ${{ vars.ORGANIZATION_NAME }}
          project-name: ${{ vars.PROJECT_NAME }}
          version: ${{ needs.get_and_validate_version.outputs.version }}
          website-url: ${{ vars.WEBSITE_URL }}
          local-post-template-file-path: "${{ github.workspace }}/templates/release-announcement.txt"
          discord-invite-code: ${{ vars.DISCORD_INVITE_CODE }}
          service: ${{ vars.BLUESKY_SERVICE }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}
          cache-enabled: ${{ inputs.cache-disabled == true && 'false' || 'true' }}
          github-token: ${{ secrets.CICD_TOKEN }}
