name: 🚀Release
run-name: ${{ vars.PROJECT_NAME }} ${{ inputs.release-type }} Release ${{ inputs.dry-run == true && '(Dry Run)' || '' }}


defaults:
  run:
    shell: pwsh


on:
  workflow_dispatch:
    inputs:
      release-type:
        description: The type of release.  Choose 'Preview' or 'Production'.
        required: true
        type: choice
        options: [Preview, Production]
      dry-run:
        description: Dry Run - Check to run the workflow without creating a release.
        required: false
        default: false
        type: boolean


jobs:
  determine_release_notes_path:
    name: Determine Release Notes Dir Path
    runs-on: ubuntu-latest
    outputs:
      release-notes-dir-path: ${{ steps.get-dir-path.outputs.release-notes-dir-path }}
    steps:
      - name: Get Dir Path
        id: get-dir-path
        run: |
          $dirPath = "${{ inputs.release-type }}" -eq "Production" ? "${{ vars.PROD_RELATIVE_RELEASE_NOTES_DIR_PATH }}" : "${{ vars.PREV_RELATIVE_RELEASE_NOTES_DIR_PATH }}";
          "release-notes-dir-path=$dirPath" >> $env:GITHUB_OUTPUT;


  get_and_validate_version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get Version
        id: get-version
        uses: KinsonDigital/Infrastructure/actions/get-version@v16.0.0
        with:
          version-file-path: "${{ github.workspace }}/${{ vars.PROJECT_NAME }}/${{ vars.PROJECT_NAME }}.csproj"
          deno-version: "${{ vars.DENO_VERSION }}"

      - name: Validate Version
        uses: KinsonDigital/Infrastructure/actions/validate-version@v16.0.0
        with:
          version: "v${{ steps.get-version.outputs.version }}"
          release-type: "${{ inputs.release-type }}"
          deno-version: "${{ vars.DENO_VERSION }}"


  run_tests:
    name: Building Testing Project
    needs: get_and_validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Run Tests
        run: |
          dotnet test "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}Tests.csproj" `
            -c ${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }};


  run_release:
    name: Performing ${{ inputs.release-type }} Release of ${{ vars.PROJECT_NAME }} (${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }})
    needs: [get_and_validate_version, determine_release_notes_path, run_tests]
    uses: KinsonDigital/Infrastructure/.github/workflows/dotnet-lib-release.yml@v16.0.0
    with:
      project-name: "${{ vars.PROJECT_NAME}}"
      release-type: "${{ inputs.release-type }}"
      net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
      release-notes-file-path: "${{ needs.determine_release_notes_path.outputs.release-notes-dir-path }}/${{ vars.RELEASE_NOTES_FILE_NAME_PREFIX }}"
      build-config: ${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }}
      send-x-release-post: ${{ vars.X_BROADCAST_ENABLED == 'true' }}
      dry-run: ${{ inputs.dry-run }}
      transpile-readme: true
      deno-version: "${{ vars.DENO_VERSION }}"
    secrets:
      cicd-pat: "${{ secrets.CICD_TOKEN }}"
      nuget-org-api-key: "${{ secrets.NUGET_ORG_API_KEY }}"
      x-consumer-api-key: "${{ secrets.X_CONSUMER_API_KEY }}"
      x-consumer-api-secret: "${{ secrets.X_CONSUMER_API_SECRET }}"
      x-access-token-key: "${{ secrets.X_ACCESS_TOKEN_KEY }}"
      x-access-token-secret: "${{ secrets.X_ACCESS_TOKEN_SECRET }}"
